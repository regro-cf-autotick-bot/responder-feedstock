{% set version = "3.3.0" %}

package:
  name: responder
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/responder/responder-{{ version }}.tar.gz
  sha256: 4d14668e22f77d0e8b3ccec22a178bba6933712f78adc79961704a1cbb534e1b

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - responder = responder.cli:cli

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - aiofiles
    - apispec >=1.0.0b1
    - apistar
    - chardet
    - docopt
    - graphene <3.0
    - graphql-server-core >=1.1
    - itsdangerous
    - jinja2
    - marshmallow
    - python-multipart
    - pyyaml
    - requests
    - requests-toolbelt
    - rfc3986
    - starlette ~=0.13.0
    - uvicorn >=0.12.0,<0.13.3
    - whitenoise

test:
  imports:
    - responder
  commands:
    - responder --help

about:
  home: https://github.com/taoufik07/responder
  license: APACHE-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: A familiar HTTP Service Framework for Python
  doc_url: http://python-responder.org/

extra:
  recipe-maintainers:
    - dhirschfeld
    - carlodri
